<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الموقع تحت الصيانة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090f;--t:#eef2f8;--m:#8a94a6;--a:#36d1ff;--box:box-sizing:border-box}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 30%,#121a2b 0%,#07090f 70%);color:var(--t);font-family:'Cairo',Tahoma,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:env(safe-area-inset-top,0) 20px calc(env(safe-area-inset-bottom,0) + 16px);overflow-x:hidden}
main{flex:1;display:flex;flex-direction:column;align-items:center;width:100%;padding-top:14px}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-bottom:60px}
svg{width:min(150px,38vw);height:auto;overflow:visible}
h1{font-size:clamp(1.05rem,3.8vw,1.6rem);font-weight:800;line-height:1.5;margin-top:6px}
p{font-size:.95rem;color:var(--m)}
.spin{position:relative;width:38px;height:38px;margin-top:14px}
.spin i{position:absolute;left:50%;top:0;width:3.5px;height:10px;margin-left:-1.75px;border-radius:3px;background:#dfe6f2;transform-origin:50% 19px;opacity:.15;animation:f 1s linear infinite}
@keyframes f{0%{opacity:1}100%{opacity:.15}}
footer{font-size:.6rem;color:#4b5467;padding-top:10px}
/* robot animation */
.float{animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-5px)}}
.arm{transform-origin:206px 150px;animation:arm .55s ease-in-out infinite alternate}
@keyframes arm{from{transform:rotate(-7deg)}to{transform:rotate(9deg)}}
.eye{animation:bl 5s infinite;transform-origin:center;transform-box:fill-box}
@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.spark{animation:sp .55s steps(1) infinite alternate;transform-origin:196px 222px}
@keyframes sp{from{opacity:1;transform:scale(1)}to{opacity:.25;transform:scale(.6)}}
.gear{transform-origin:66px 228px;animation:rot 6s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.led{animation:ld 1.2s infinite alternate}
@keyframes ld{from{opacity:1}to{opacity:.3}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main>
<svg viewBox="0 0 300 290" role="img" aria-label="روبوت يقوم بالإصلاح">
<defs>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f7fb"/><stop offset=".5" stop-color="#b9c3d3"/><stop offset="1" stop-color="#6b7689"/></linearGradient>
<linearGradient id="dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b3547"/><stop offset="1" stop-color="#10151f"/></linearGradient>
<radialGradient id="eyeg"><stop offset="0" stop-color="#e6fbff"/><stop offset=".45" stop-color="#36d1ff"/><stop offset="1" stop-color="#0a5d82"/></radialGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#fff6c2"/><stop offset=".4" stop-color="#ffb02e" stop-opacity=".9"/><stop offset="1" stop-color="#ff6a00" stop-opacity="0"/></radialGradient>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".5"/></filter>
</defs>
<ellipse cx="150" cy="272" rx="105" ry="9" fill="#000" opacity=".45"/>
<!-- broken panel -->
<g transform="translate(190 205)">
<rect x="-6" y="0" width="92" height="64" rx="6" fill="url(#dark)" stroke="#3b475c"/>
<rect x="6" y="10" width="68" height="8" rx="3" fill="#36d1ff" opacity=".25"/>
<rect x="6" y="26" width="44" height="6" rx="3" fill="#36d1ff" opacity=".15"/>
<circle cx="70" cy="50" r="4" fill="#ff5a4d" class="led"/>
<circle cx="56" cy="50" r="4" fill="#3ddc84"/>
</g>
<!-- gear -->
<g class="gear"><g fill="#8e9aae" stroke="#47536a">
<circle cx="66" cy="228" r="22"/><circle cx="66" cy="228" r="8" fill="#10151f"/>
<rect x="62" y="200" width="8" height="10"/><rect x="62" y="246" width="8" height="10"/>
<rect x="38" y="224" width="10" height="8"/><rect x="84" y="224" width="10" height="8"/>
</g></g>
<g class="float" filter="url(#sh)">
<!-- antenna -->
<line x1="150" y1="30" x2="150" y2="48" stroke="#8e9aae" stroke-width="4"/>
<circle cx="150" cy="26" r="6" fill="#ff5a4d" class="led"/>
<!-- head -->
<rect x="102" y="46" width="96" height="74" rx="26" fill="url(#metal)"/>
<rect x="112" y="58" width="76" height="48" rx="18" fill="url(#dark)"/>
<g class="eye"><circle cx="135" cy="82" r="11" fill="url(#eyeg)"/><circle cx="165" cy="82" r="11" fill="url(#eyeg)"/></g>
<circle cx="131" cy="78" r="3" fill="#fff" opacity=".8"/><circle cx="161" cy="78" r="3" fill="#fff" opacity=".8"/>
<rect x="96" y="70" width="8" height="24" rx="4" fill="#6b7689"/><rect x="196" y="70" width="8" height="24" rx="4" fill="#6b7689"/>
<!-- hard hat -->
<path d="M106 54 Q150 14 194 54 Z" fill="#ffb02e"/><rect x="100" y="50" width="100" height="8" rx="4" fill="#e08c00"/>
<rect x="144" y="28" width="12" height="22" rx="3" fill="#ffc85a"/>
<!-- neck/torso -->
<rect x="138" y="120" width="24" height="12" fill="#47536a"/>
<rect x="104" y="130" width="92" height="88" rx="24" fill="url(#metal)"/>
<rect x="120" y="146" width="60" height="38" rx="10" fill="url(#dark)"/>
<circle cx="150" cy="165" r="9" fill="#36d1ff" class="led"/>
<rect x="124" y="194" width="52" height="6" rx="3" fill="#6b7689"/>
<!-- left arm holding wrench -->
<g><rect x="76" y="136" width="30" height="16" rx="8" fill="url(#metal)"/>
<rect x="70" y="146" width="16" height="50" rx="8" fill="url(#metal)"/><circle cx="78" cy="200" r="10" fill="#47536a"/></g>
<!-- right arm with welding torch -->
<g class="arm">
<rect x="194" y="136" width="28" height="16" rx="8" fill="url(#metal)"/>
<rect x="206" y="146" width="16" height="52" rx="8" fill="url(#metal)" transform="rotate(14 214 146)"/>
<g transform="rotate(14 214 146)"><rect x="203" y="196" width="22" height="12" rx="5" fill="#47536a"/>
<rect x="210" y="206" width="8" height="18" fill="#2b3547"/></g>
</g>
<!-- sparks -->
<g class="spark"><circle cx="196" cy="222" r="18" fill="url(#glow)"/>
<path d="M196 204v-10M180 214l-9-6M212 214l9-6M184 232l-8 7M208 232l8 7" stroke="#ffd56a" stroke-width="2.5" stroke-linecap="round"/></g>
<!-- legs -->
<rect x="120" y="216" width="22" height="34" rx="9" fill="#47536a"/><rect x="158" y="216" width="22" height="34" rx="9" fill="#47536a"/>
<rect x="112" y="246" width="36" height="16" rx="8" fill="url(#dark)"/><rect x="152" y="246" width="36" height="16" rx="8" fill="url(#dark)"/>
</g>
</svg>
<div class="mid">
<h1>يوجد بعض الإصلاحات والتحسينات</h1>
<p>سنعود قريباً</p>
<div class="spin" role="status" aria-label="جارٍ التحميل" id="spin"></div>
</div>
</main>
<footer>© جميع الحقوق محفوظة — أحمد غنيم</footer>
<script>
var s=document.getElementById('spin');
for(var i=0;i<12;i++){var e=document.createElement('i');e.style.transform='rotate('+i*30+'deg)';e.style.animationDelay=(-1+i/12)+'s';s.appendChild(e);}
</script>
</body>
</html>
